name: Build

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths: [ "StreamingCommunity/**" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      packages: read
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout builds
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"
      
      - name: Clean old builds
        run: rm $GITHUB_WORKSPACE/builds/*.cs3 || true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses

      - name: Access Secrets
        env:
          TMDB_API: ${{ secrets.TMDB_API }}
          TMDB_API3: ${{ secrets.TMDB_API3 }}
          WATCHPARTY_RELAY: ${{ secrets.WATCHPARTY_RELAY }}
        run: |
          cd $GITHUB_WORKSPACE/src
          echo TMDB_API=$TMDB_API >> secrets.properties
          echo TMDB_API3=$TMDB_API3 >> secrets.properties
          echo WATCHPARTY_RELAY=$WATCHPARTY_RELAY >> secrets.properties

      - name: Build Plugins
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          
          ./gradlew StreamingCommunity:make makePluginsJson \
            -Pgpr.user="$GITHUB_ACTOR" \
            -Pgpr.key="$GITHUB_TOKEN"
            
          cp StreamingCommunity/build/*.cs3 $GITHUB_WORKSPACE/builds

      # Fork: solo StreamingCommunity viene da qui, gli altri plugin restano quelli di upstream
      - name: Merge plugins.json and repo.json
        run: |
          cd $GITHUB_WORKSPACE
          curl -fsSL https://raw.githubusercontent.com/DieGon7771/ItaliaInStreaming/builds/plugins.json -o upstream.json
          jq -s '[.[0][] | select(.internalName != "StreamingCommunity")] + [.[1][] | select(.internalName == "StreamingCommunity")]' \
            upstream.json src/build/plugins.json > builds/plugins.json
          jq --arg r "$GITHUB_REPOSITORY" '.pluginLists = ["https://raw.githubusercontent.com/\($r)/builds/plugins.json"]' \
            builds/repo.json > repo.tmp && mv repo.tmp builds/repo.json

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit --amend -m "Build $GITHUB_SHA" || exit 0
          git push --force
